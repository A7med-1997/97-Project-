<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Timing Tools / أدوات توقيت التحالف</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 500px;
        }

        /* BANNER / MOTIVATIONAL QUOTE */
        .quote-banner {
            background: linear-gradient(135deg, rgba(255, 107, 129, 0.08), rgba(255, 71, 87, 0.03));
            border: 1px solid rgba(255, 107, 129, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .quote-banner:hover {
            border-color: rgba(255, 107, 129, 0.4);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.15);
        }

        .quote-text {
            color: #d1d8e0;
            font-size: 0.85rem;
            line-height: 1.5;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .quote-tag {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.75rem;
            color: #ff6b81;
            font-weight: 700;
            font-style: normal;
            letter-spacing: 1px;
        }

        /* HEADER & LANGUAGE SWITCHER */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .lang-btn {
            background: #252525;
            color: #ff6b81;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: auto;
        }

        .lang-btn:hover {
            background: #ff4757;
            color: #fff;
        }

        /* NAVIGATION TABS */
        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #1e1e1e;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            background: transparent;
            color: #aaa;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .tab-btn:hover {
            color: #fff;
            background: #282828;
        }

        .tab-btn.active {
            background: #ff4757;
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        /* CONTAINER & CARDS */
        .container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            display: none;
        }

        .container.active {
            display: block;
        }

        h2 {
            text-align: center;
            color: #ff4757;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .section-title {
            color: #ff6b81;
            font-size: 1rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* INPUT GROUPS */
        .input-group {
            margin-bottom: 15px;
            background: #252525;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .time-inputs {
            display: flex;
            gap: 10px;
        }

        .time-field {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #ff4757;
        }

        /* BUTTONS */
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        button:hover {
            background-color: #ff6b81;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-add {
            background: #252525;
            color: #ff6b81;
            border: 1px solid #444;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .btn-add:hover {
            background: #303030;
            color: #ff4757;
        }

        .btn-delete {
            background: #2a1517;
            color: #ff4757;
            border: 1px solid #5a1e24;
            padding: 0;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border-radius: 8px;
        }

        .btn-delete:hover {
            background: #ff4757;
            color: #fff;
        }

        /* DYNAMIC ROWS FOR TOOL 2 */
        .player-row {
            display: grid;
            grid-template-columns: 1fr 110px 42px;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        /* RESULTS BOX */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #252525;
            border: 1px solid #333;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            display: none;
            line-height: 1.6;
        }

        .alert-time {
            color: #2ed573;
            font-size: 1.4rem;
            display: block;
            margin-top: 5px;
        }

        .alert-warning {
            color: #ffa502;
        }

        /* TEAM RESULT STYLES */
        .hit-banner {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #ff4757;
            border-radius: 8px;
            color: #2ed573;
            background: rgba(46, 213, 115, 0.05);
        }

        .result-row {
            display: grid;
            grid-template-columns: 1fr 80px 80px;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid #333;
            align-items: center;
            font-size: 0.95rem;
        }

        .result-header {
            color: #888;
            font-size: 0.8rem;
            font-weight: bold;
            border-bottom: 2px solid #444;
        }

        .time-val {
            color: #ff4757;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
        }

        .time-actions {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }

        .adjust-btn {
            background: #1a1a1a;
            color: #ff6b81;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            width: auto;
        }

        .adjust-btn:hover {
            background: #ff4757;
            color: #fff;
        }

        .btn-copy {
            background: #252525;
            border: 1px solid #ff4757;
            color: #ff4757;
            margin-top: 15px;
        }

        .btn-copy:hover {
            background: #ff4757;
            color: #fff;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- TOP BAR FOR LANGUAGE TOGGLE -->
        <div class="top-bar">
            <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">🌐 English</button>
        </div>

        <!-- MOTIVATIONAL QUOTE BANNER -->
        <div class="quote-banner">
            <div class="quote-text">"Don't push yourself too hard. Just do your best and don't worry about the outcome."</div>
            <div class="quote-tag">— 1997 —</div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="tabs-nav">
            <button class="tab-btn active" id="tab1Btn" onclick="switchTab('tool1')">🛡️ وقت التعزيز</button>
            <button class="tab-btn" id="tab2Btn" onclick="switchTab('tool2')">⚔️ وقت الرالي</button>
        </div>

        <!-- TOOL 1: REINFORCE TIMING (وقت التعزيز) -->
        <div id="tool1" class="container active">
            <h2 id="tool1Title">🛡️ وقت التعزيز</h2>

            <div class="input-group">
                <div class="section-title" id="enemySectionTitle">🎯 مسيرة الخصم / الرالي:</div>
                <div class="time-inputs">
                    <div class="time-field">
                        <label class="lbl-min">الدقائق</label>
                        <input type="number" id="enemyMin" value="0" min="0">
                    </div>
                    <div class="time-field">
                        <label class="lbl-sec">الثواني</label>
                        <input type="number" id="enemySec" placeholder="30" min="0">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <div class="section-title" id="mySectionTitle">🛡️ مسيرتك:</div>
                <div class="time-inputs">
                    <div class="time-field">
                        <label class="lbl-min">الدقائق</label>
                        <input type="number" id="myMin" value="0" min="0">
                    </div>
                    <div class="time-field">
                        <label class="lbl-sec">الثواني</label>
                        <input type="number" id="mySec" placeholder="40" min="0">
                    </div>
                </div>
            </div>

            <button id="calcBtn1" onclick="calculateTiming()">حساب التوقيت</button>

            <div class="result-box" id="resultBox1"></div>
        </div>

        <!-- TOOL 2: RALLY MULTI-PLAYER TIMING (وقت الرالي) -->
        <div id="tool2" class="container">
            <h2 id="tool2Title">⚔️ وقت الرالي</h2>

            <div id="playersList">
                <div class="player-row">
                    <input type="text" class="input-player-name" placeholder="اسم اللاعب" oninput="autoCalculateTeam()">
                    <input type="number" class="input-player-sec" placeholder="الثواني" min="0" oninput="autoCalculateTeam()">
                    <button class="btn-delete" onclick="removePlayer(this)">×</button>
                </div>
                <div class="player-row">
                    <input type="text" class="input-player-name" placeholder="اسم اللاعب" oninput="autoCalculateTeam()">
                    <input type="number" class="input-player-sec" placeholder="الثواني" min="0" oninput="autoCalculateTeam()">
                    <button class="btn-delete" onclick="removePlayer(this)">×</button>
                </div>
            </div>

            <button class="btn-add" id="btnAddPlayer" onclick="addPlayer()">+ إضافة لاعب</button>
            <button id="calcBtn2" onclick="calculateTeam()">حساب التوقيت</button>

            <div class="result-box" id="resultBox2">
                <div class="hit-banner">
                    <span id="hitTimeText">🎯 وقت وصول الضربة:</span> <span id="hitTime">00:00</span>
                </div>

                <div class="result-row result-header">
                    <div id="hdrPlayer" style="text-align: right;">اللاعب</div>
                    <div id="hdrLaunch">الانطلاق</div>
                    <div id="hdrAdjust" style="text-align: left;">تعديل</div>
                </div>

                <div id="teamResults"></div>

                <button class="btn-copy" id="btnCopyResults" onclick="copyTeamResults()">📋 نسخ النتائج</button>
            </div>
        </div>

        <div class="footer">
            Whiteout Survival Alliance Tools
        </div>
    </div>

    <script>
        let currentLang = 'ar';

        const i18n = {
            ar: {
                langBtn: '🌐 English',
                tab1: '🛡️ وقت التعزيز',
                tab2: '⚔️ وقت الرالي',
                tool1Title: '🛡️ وقت التعزيز',
                tool2Title: '⚔️ وقت الرالي',
                enemySection: '🎯 مسيرة الخصم / الرالي:',
                mySection: '🛡️ مسيرتك:',
                minLabel: 'الدقائق',
                secLabel: 'الثواني',
                calcBtn: 'حساب التوقيت',
                invalidTime: 'يرجى إدخال وقت صحيح أكبر من الصفر!',
                launchAlert: (t) => `انطلق عندما يتبقى لمسيرة الخصم ${t} قبل الوصول`,
                launchSame: 'انطلق في نفس وقت انطلاق الخصم تماماً!',
                launchEarly: (t) => `يجب أن تنطلق قبل انطلاق الرالي بـ ${t}`,
                minWord: 'دقيقة',
                secWord: 'ثانية',
                andWord: 'و',
                playerNamePh: 'اسم اللاعب',
                playerSecPh: 'الثواني',
                addPlayer: '+ إضافة لاعب',
                hitTimeText: '🎯 وقت وصول الضربة:',
                hdrPlayer: 'اللاعب',
                hdrLaunch: 'الانطلاق',
                hdrAdjust: 'تعديل',
                copyBtn: '📋 نسخ النتائج',
                copiedBtn: '✓ تم النسخ!',
                copyHeader: '⚔️ توقيت انطلاق الرالي ⚔️\n\n',
                copyHitTime: '🎯 وقت وصول الضربة: '
            },
            en: {
                langBtn: '🌐 العربية',
                tab1: '🛡️ Reinforce Time',
                tab2: '⚔️ Rally Time',
                tool1Title: '🛡️ Reinforce Time',
                tool2Title: '⚔️ Rally Time',
                enemySection: '🎯 Enemy / Rally March:',
                mySection: '🛡️ Your March:',
                minLabel: 'Minutes',
                secLabel: 'Seconds',
                calcBtn: 'Calculate Timing',
                invalidTime: 'Please enter a valid time greater than zero!',
                launchAlert: (t) => `Launch when enemy march has ${t} remaining`,
                launchSame: 'Launch at the exact same time as the enemy!',
                launchEarly: (t) => `You must launch ${t} before the rally starts`,
                minWord: 'min',
                secWord: 'sec',
                andWord: '&',
                playerNamePh: 'Player Name',
                playerSecPh: 'Seconds',
                addPlayer: '+ Add Player',
                hitTimeText: '🎯 Hit Time:',
                hdrPlayer: 'Player',
                hdrLaunch: 'Launch',
                hdrAdjust: 'Adjust',
                copyBtn: '📋 Copy Results',
                copiedBtn: '✓ Copied!',
                copyHeader: '⚔️ Rally Launch Timings ⚔️\n\n',
                copyHitTime: '🎯 Hit Time: '
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', currentLang);
            updateUI();
        }

        function updateUI() {
            const t = i18n[currentLang];

            document.getElementById('langBtn').textContent = t.langBtn;
            document.getElementById('tab1Btn').textContent = t.tab1;
            document.getElementById('tab2Btn').textContent = t.tab2;
            document.getElementById('tool1Title').textContent = t.tool1Title;
            document.getElementById('tool2Title').textContent = t.tool2Title;
            document.getElementById('enemySectionTitle').textContent = t.enemySection;
            document.getElementById('mySectionTitle').textContent = t.mySection;
            document.getElementById('calcBtn1').textContent = t.calcBtn;
            document.getElementById('calcBtn2').textContent = t.calcBtn;
            document.getElementById('btnAddPlayer').textContent = t.addPlayer;
            document.getElementById('hitTimeText').textContent = t.hitTimeText;
            document.getElementById('hdrPlayer').textContent = t.hdrPlayer;
            document.getElementById('hdrLaunch').textContent = t.hdrLaunch;
            document.getElementById('hdrAdjust').textContent = t.hdrAdjust;
            document.getElementById('btnCopyResults').textContent = t.copyBtn;

            document.querySelectorAll('.lbl-min').forEach(el => el.textContent = t.minLabel);
            document.querySelectorAll('.lbl-sec').forEach(el => el.textContent = t.secLabel);
            document.querySelectorAll('.input-player-name').forEach(el => el.placeholder = t.playerNamePh);
            document.querySelectorAll('.input-player-sec').forEach(el => el.placeholder = t.playerSecPh);

            const align = currentLang === 'ar' ? 'right' : 'left';
            const oppAlign = currentLang === 'ar' ? 'left' : 'right';
            document.getElementById('hdrPlayer').style.textAlign = align;
            document.getElementById('hdrAdjust').style.textAlign = oppAlign;

            if (document.getElementById('resultBox1').style.display === 'block') calculateTiming();
            if (document.getElementById('resultBox2').style.display === 'block') renderTeamResults();
        }

        /* TAB SWITCHING LOGIC */
        function switchTab(tabId) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        /* TOOL 1: REINFORCE TIMING LOGIC */
        function formatTimeTool1(seconds) {
            const t = i18n[currentLang];
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            if (mins > 0) {
                return `${mins} ${t.minWord} ${t.andWord} ${secs} ${t.secWord}`;
            }
            return `${secs} ${t.secWord}`;
        }

        function calculateTiming() {
            const t = i18n[currentLang];
            const enemyMin = parseFloat(document.getElementById('enemyMin').value) || 0;
            const enemySec = parseFloat(document.getElementById('enemySec').value) || 0;
            const myMin = parseFloat(document.getElementById('myMin').value) || 0;
            const mySec = parseFloat(document.getElementById('mySec').value) || 0;

            const resultBox = document.getElementById('resultBox1');
            const totalEnemyTime = (enemyMin * 60) + enemySec;
            const totalMyTime = (myMin * 60) + mySec;

            if (totalEnemyTime <= 0 || totalMyTime <= 0) {
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<span class="alert-warning">${t.invalidTime}</span>`;
                return;
            }

            const launchAt = totalEnemyTime - totalMyTime;
            resultBox.style.display = 'block';

            if (launchAt > 0) {
                resultBox.innerHTML = `<span class="alert-time">${t.launchAlert(formatTimeTool1(launchAt))}</span>`;
            } else if (launchAt === 0) {
                resultBox.innerHTML = `<span class="alert-time">${t.launchSame}</span>`;
            } else {
                resultBox.innerHTML = `<span class="alert-time">${t.launchEarly(formatTimeTool1(Math.abs(launchAt)))}</span>`;
            }
        }

        /* TOOL 2: RALLY MULTI-PLAYER LOGIC */
        let computedPlayers = [];
        let maxHitDuration = 0;

        function addPlayer() {
            const t = i18n[currentLang];
            const list = document.getElementById("playersList");
            const row = document.createElement("div");
            row.className = "player-row";
            row.innerHTML = `
                <input type="text" class="input-player-name" placeholder="${t.playerNamePh}" oninput="autoCalculateTeam()">
                <input type="number" class="input-player-sec" placeholder="${t.playerSecPh}" min="0" oninput="autoCalculateTeam()">
                <button class="btn-delete" onclick="removePlayer(this)">×</button>
            `;
            list.appendChild(row);
        }

        function removePlayer(button) {
            const rows = document.querySelectorAll("#playersList .player-row");
            if (rows.length <= 1) return;
            button.parentElement.remove();
            autoCalculateTeam();
        }

        function formatTimeMMSS(seconds) {
            if (seconds < 0) seconds = 0;
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
        }

        function calculateTeam() {
            const rows = document.querySelectorAll("#playersList .player-row");
            let inputData = [];

            rows.forEach(row => {
                const name = row.children[0].value.trim();
                const seconds = Number(row.children[1].value);
                if (name !== "" && !isNaN(seconds) && seconds >= 0) {
                    inputData.push({ name, duration: seconds });
                }
            });

            if (inputData.length === 0) {
                document.getElementById("resultBox2").style.display = "none";
                computedPlayers = [];
                return;
            }

            maxHitDuration = Math.max(...inputData.map(p => p.duration));
            inputData.sort((a, b) => b.duration - a.duration);

            computedPlayers = inputData.map((player, index) => ({
                id: index,
                name: player.name,
                duration: player.duration,
                startTime: maxHitDuration - player.duration
            }));

            renderTeamResults();
            document.getElementById("resultBox2").style.display = "block";
        }

        function renderTeamResults() {
            const container = document.getElementById("teamResults");
            container.innerHTML = "";
            const align = currentLang === 'ar' ? 'right' : 'left';

            computedPlayers.forEach((player, idx) => {
                const row = document.createElement("div");
                row.className = "result-row";
                row.innerHTML = `
                    <div style="text-align: ${align};">${escapeHTML(player.name)}</div>
                    <div class="time-val" id="team-time-${idx}">${formatTimeMMSS(player.startTime)}</div>
                    <div class="time-actions">
                        <button class="adjust-btn" onclick="adjustTeamTime(${idx}, -1)">-1</button>
                        <button class="adjust-btn" onclick="adjustTeamTime(${idx}, 1)">+1</button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById("hitTime").textContent = formatTimeMMSS(maxHitDuration);
        }

        function adjustTeamTime(index, amount) {
            if (computedPlayers[index]) {
                computedPlayers[index].startTime += amount;
                if (computedPlayers[index].startTime < 0) computedPlayers[index].startTime = 0;
                
                const displayEl = document.getElementById(`team-time-${index}`);
                if (displayEl) displayEl.textContent = formatTimeMMSS(computedPlayers[index].startTime);
            }
        }

        function autoCalculateTeam() {
            const rows = document.querySelectorAll("#playersList .player-row");
            let hasData = false;
            rows.forEach(row => {
                if (row.children[0].value.trim() !== "" && !isNaN(Number(row.children[1].value))) {
                    hasData = true;
                }
            });
            if (hasData) calculateTeam();
        }

        function copyTeamResults() {
            if (computedPlayers.length === 0) return;
            const t = i18n[currentLang];

            let text = t.copyHeader;
            computedPlayers.forEach(p => {
                text += `${p.name} — ${formatTimeMMSS(p.startTime)}\n`;
            });
            text += `\n${t.copyHitTime}${document.getElementById("hitTime").textContent}`;

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById("btnCopyResults");
                const old = btn.textContent;
                btn.textContent = t.copiedBtn;
                setTimeout(() => btn.textContent = old, 1500);
            });
        }

        function escapeHTML(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
