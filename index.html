<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rally Sync ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 10%, #3b1635 0%, transparent 30%),
        radial-gradient(circle at 80% 90%, #40133b 0%, transparent 30%),
        #0d050c;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 20px;
    overflow-x: hidden;
}

/* ✨ Sparkles */
body::before,
body::after {
    content: "✦  ✧  ✦  ✧  ✦  ✧  ✦  ✧";
    position: fixed;
    width: 100%;
    left: 0;
    color: #ff9de2;
    font-size: 18px;
    letter-spacing: 28px;
    opacity: .35;
    pointer-events: none;
    animation: sparkle 5s linear infinite;
}

body::before {
    top: 8%;
}

body::after {
    top: 75%;
    animation-delay: 2s;
}

@keyframes sparkle {
    0% {
        transform: translateX(-20px);
        opacity: .15;
    }

    50% {
        opacity: .7;
    }

    100% {
        transform: translateX(20px);
        opacity: .15;
    }
}

.container {
    max-width: 720px;
    margin: auto;
}

/* HEADER */

h1 {
    text-align: center;
    margin: 5px 0;
    color: #ffb7e8;
    font-size: 32px;
    letter-spacing: 3px;

    text-shadow:
        0 0 8px #ff4fc3,
        0 0 20px #ff4fc3;
}

.subtitle {
    text-align: center;
    color: #d98ac4;
    margin-bottom: 25px;
}

/* CARD */

.card {
    background: rgba(24, 8, 21, .94);
    border: 1px solid #ff4fc3;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;

    box-shadow:
        0 0 12px rgba(255, 79, 195, .25),
        inset 0 0 20px rgba(255, 79, 195, .04);
}

/* PLAYER INPUT */

.row {
    display: grid;
    grid-template-columns: 1fr 125px 42px 42px 42px;
    gap: 7px;
    margin-bottom: 11px;
    align-items: center;
}

input {
    width: 100%;
    padding: 12px;

    border-radius: 10px;
    border: 1px solid #71325f;

    background: #170914;
    color: white;

    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #ff72ce;

    box-shadow:
        0 0 8px rgba(255, 114, 206, .35);
}

/* BUTTONS */

button {
    border: none;
    border-radius: 10px;

    padding: 11px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

button:active {
    transform: scale(.92);
}

/* +1 / -1 */

.plus,
.minus {
    background: #35102d;
    color: #ff9cde;

    border: 1px solid #9d3b80;

    box-shadow:
        0 0 6px rgba(255, 80, 190, .2);
}

.plus:hover,
.minus:hover {
    background: #ff4fc3;
    color: #16000e;

    box-shadow:
        0 0 12px #ff4fc3;
}

/* DELETE */

.delete {
    background: #24101f;
    color: #ff6f9d;

    border: 1px solid #6c294f;
}

.delete:hover {
    background: #ff4f8b;
    color: #21000f;
}

/* ADD */

.add {
    width: 100%;

    background: #241021;
    color: #ffb7e8;

    border: 1px solid #8e3976;

    margin-top: 5px;
}

.add:hover {
    background: #32142e;
}

/* CALCULATE */

.calculate {
    width: 100%;

    background:
        linear-gradient(
            90deg,
            #ff4fc3,
            #ff8dd8
        );

    color: #210018;

    margin-top: 10px;

    font-size: 17px;

    box-shadow:
        0 0 15px rgba(255, 79, 195, .4);
}

.calculate:hover {
    box-shadow:
        0 0 25px rgba(255, 79, 195, .7);
}

/* RESULT */

.result {
    display: none;
}

.hit {
    text-align: center;

    font-size: 23px;
    font-weight: bold;

    margin-bottom: 18px;
    padding: 15px;

    border: 1px solid #ff6dcc;
    border-radius: 12px;

    color: #ff9ddd;

    background:
        rgba(255, 79, 195, .06);

    text-shadow:
        0 0 10px #ff4fc3;
}

.result-row {
    display: grid;

    grid-template-columns: 1fr 120px;

    gap: 10px;

    padding: 13px 8px;

    border-bottom:
        1px solid #3b1834;

    align-items: center;
}

.result-header {
    color: #a96c9b;
    font-size: 13px;
}

.time {
    color: #ff91d8;

    font-weight: bold;

    text-align: center;

    text-shadow:
        0 0 7px #ff4fc3;
}

/* COPY */

.copy {
    width: 100%;

    background: #291024;

    color: #ff9ddd;

    border: 1px solid #a23d83;

    margin-top: 15px;

    font-size: 17px;
}

.copy:hover {
    background: #ff4fc3;
    color: #210018;
}

/* COPY BOX */

.copyBox {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 90%;
    max-width: 500px;

    background: #170914;

    border: 2px solid #ff4fc3;

    border-radius: 15px;

    padding: 18px;

    z-index: 9999;

    box-shadow:
        0 0 30px rgba(255, 79, 195, .5);
}

.copyBox textarea {
    width: 100%;

    min-height: 180px;

    resize: none;

    padding: 12px;

    border-radius: 10px;

    border: 1px solid #a23d83;

    background: #0d050c;

    color: #ffb7e8;

    font-size: 16px;

    outline: none;
}

.closeCopy {
    width: 100%;

    margin-top: 10px;

    background: #ff4fc3;

    color: #210018;
}

/* FOOTER */

.footer {
    text-align: center;

    color: #8c557e;

    font-size: 12px;

    margin-top: 20px;
}

/* MOBILE */

@media (max-width: 550px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 27px;
    }

    .row {
        grid-template-columns:
            1fr 82px 36px 36px 36px;

        gap: 5px;
    }

    .row button {
        padding: 10px 4px;
    }

    .result-row {
        grid-template-columns:
            1fr 85px;

        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>  1997  </h1>

    <div class="subtitle">
          SVS TOOLS
    </div>


    <!-- INPUT CARD -->

    <div class="card">

        <div id="players">

            <div class="row">

                <input
                    type="text"
                    placeholder="Player name"
                    oninput="autoCalculate()"
                >

                <input
                    type="number"
                    placeholder="Seconds"
                    min="0"
                    oninput="autoCalculate()"
                >

                <button
                    class="minus"
                    onclick="changeTime(this, -1)"
                >
                    −1
                </button>

                <button
                    class="plus"
                    onclick="changeTime(this, 1)"
                >
                    +1
                </button>

                <button
                    class="delete"
                    onclick="removePlayer(this)"
                >
                    ×
                </button>

            </div>


            <div class="row">

                <input
                    type="text"
                    placeholder="Player name"
                    oninput="autoCalculate()"
                >

                <input
                    type="number"
                    placeholder="Seconds"
                    min="0"
                    oninput="autoCalculate()"
                >

                <button
                    class="minus"
                    onclick="changeTime(this, -1)"
                >
                    −1
                </button>

                <button
                    class="plus"
                    onclick="changeTime(this, 1)"
                >
                    +1
                </button>

                <button
                    class="delete"
                    onclick="removePlayer(this)"
                >
                    ×
                </button>

            </div>

        </div>


        <button
            class="add"
            onclick="addPlayer()"
        >
            ✨ ＋ Add Player ✨
        </button>


        <button
            class="calculate"
            onclick="calculate()"
        >
            💗 CALCULATE 💗
        </button>

    </div>


    <!-- RESULTS -->

    <div
        class="card result"
        id="result"
    >

        <div class="hit">

            ✨ HIT TIME:

            <span id="hitTime">
                00:00
            </span>

            ✨

        </div>


        <div class="result-row result-header">

            <div>
                PLAYER
            </div>

            <div style="text-align:center">
                START
            </div>

        </div>


        <div id="results"></div>


        <button
            class="copy"
            onclick="copyResults()"
        >
            📋 COPY RESULTS
        </button>

    </div>


    <div class="footer">
        ♡ Made for synchronized rallies ♡
    </div>

</div>


<script>

let lastResults = [];


/* ADD PLAYER */

function addPlayer() {

    const players =
        document.getElementById("players");

    const row =
        document.createElement("div");

    row.className = "row";

    row.innerHTML = `

        <input
            type="text"
            placeholder="Player name"
            oninput="autoCalculate()"
        >

        <input
            type="number"
            placeholder="Seconds"
            min="0"
            oninput="autoCalculate()"
        >

        <button
            class="minus"
            onclick="changeTime(this, -1)"
        >
            −1
        </button>

        <button
            class="plus"
            onclick="changeTime(this, 1)"
        >
            +1
        </button>

        <button
            class="delete"
            onclick="removePlayer(this)"
        >
            ×
        </button>
    `;

    players.appendChild(row);
}


/* DELETE PLAYER */

function removePlayer(button) {

    const rows =
        document.querySelectorAll(
            "#players .row"
        );

    if (rows.length <= 1) {
        return;
    }

    button.parentElement.remove();

    autoCalculate();
}


/* +1 / -1 */

function changeTime(button, amount) {

    const input =
        button.parentElement.children[1];

    let value =
        Number(input.value) || 0;

    value += amount;

    if (value < 0) {
        value = 0;
    }

    input.value = value;

    calculate();
}


/* FORMAT TIME */

function formatTime(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );
}


/* CALCULATE */

function calculate() {

    const rows =
        document.querySelectorAll(
            "#players .row"
        );

    let players = [];


    rows.forEach(row => {

        const name =
            row.children[0]
                .value
                .trim();

        const seconds =
            Number(
                row.children[1].value
            );


        if (
            name !== "" &&
            !isNaN(seconds) &&
            seconds >= 0
        ) {

            players.push({

                name: name,

                duration: seconds

            });

        }

    });


    if (players.length === 0) {

        document.getElementById(
            "result"
        ).style.display = "none";

        return;
    }


    /*
       أطول مسيرة تبدأ عند 00:00

       Start =
       Longest - Player Duration
    */

    const longest =
        Math.max(
            ...players.map(
                player =>
                    player.duration
            )
        );


    /* الأطول أولاً */

    players.sort(
        (a, b) =>
            b.duration - a.duration
    );


    const results =
        document.getElementById(
            "results"
        );

    results.innerHTML = "";

    lastResults = [];


    players.forEach(player => {

        const startTime =
            longest -
            player.duration;


        lastResults.push({

            name: player.name,

            time:
                formatTime(startTime)

        });


        const row =
            document.createElement("div");

        row.className =
            "result-row";


        row.innerHTML = `

            <div>
                ♡ ${escapeHTML(player.name)}
            </div>

            <div class="time">
                ${formatTime(startTime)}
            </div>

        `;


        results.appendChild(row);

    });


    document.getElementById(
        "hitTime"
    ).textContent =
        formatTime(longest);


    document.getElementById(
        "result"
    ).style.display = "block";
}


/* AUTO CALCULATE */

function autoCalculate() {

    const rows =
        document.querySelectorAll(
            "#players .row"
        );

    let hasData = false;


    rows.forEach(row => {

        const name =
            row.children[0]
                .value
                .trim();

        const seconds =
            Number(
                row.children[1].value
            );


        if (
            name !== "" &&
            !isNaN(seconds)
        ) {

            hasData = true;

        }

    });


    if (hasData) {
        calculate();
    }
}


/* COPY RESULTS */

function copyResults() {

    if (lastResults.length === 0) {
        return;
    }


    let text =
        "♡ RALLY SYNC ♡\n\n";


    lastResults.forEach(player => {

        text +=
            `${player.name} — ${player.time}\n`;

    });


    text +=
        `\n✨ HIT TIME: ${
            document.getElementById(
                "hitTime"
            ).textContent
        }`;


    /*
       الطريقة الأولى:
       navigator.clipboard
    */

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard.writeText(text)

        .then(() => {

            showCopied();

        })

        .catch(() => {

            fallbackCopy(text);

        });

    } else {

        fallbackCopy(text);

    }
}


/* FALLBACK COPY */

function fallbackCopy(text) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value = text;

    textarea.setAttribute(
        "readonly",
        ""
    );


    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.style.top =
        "0";

    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();

    textarea.setSelectionRange(
        0,
        textarea.value.length
    );


    let success = false;


    try {

        success =
            document.execCommand(
                "copy"
            );

    } catch (e) {

        success = false;

    }


    document.body.removeChild(
        textarea
    );


    if (success) {

        showCopied();

    } else {

        showManualCopy(text);

    }
}


/* COPIED */

function showCopied() {

    const button =
        document.querySelector(
            ".copy"
        );


    const oldText =
        button.textContent;


    button.textContent =
        "✓ COPIED! ✨";


    setTimeout(() => {

        button.textContent =
            oldText;

    }, 1500);
}


/* MANUAL COPY WINDOW */

function showManualCopy(text) {

    const oldBox =
        document.querySelector(
            ".copyBox"
        );

    if (oldBox) {
        oldBox.remove();
    }


    const box =
        document.createElement(
            "div"
        );

    box.className =
        "copyBox";


    box.innerHTML = `

        <div style="
            text-align:center;
            color:#ff9ddd;
            font-size:18px;
            font-weight:bold;
            margin-bottom:12px;
        ">
            ✨ Copy Results ✨
        </div>

        <textarea
            id="manualCopyText"
            readonly
        ></textarea>

        <button
            class="closeCopy"
            onclick="closeCopyBox()"
        >
            DONE ♡
        </button>

    `;


    document.body.appendChild(box);


    const textarea =
        document.getElementById(
            "manualCopyText"
        );


    textarea.value = text;

    textarea.focus();

    textarea.select();

    textarea.setSelectionRange(
        0,
        textarea.value.length
    );
}


/* CLOSE COPY BOX */

function closeCopyBox() {

    const box =
        document.querySelector(
            ".copyBox"
        );

    if (box) {
        box.remove();
    }
}


/* SECURITY */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
